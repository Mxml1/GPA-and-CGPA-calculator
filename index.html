<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/GPA-and-CGPA-calculator/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>UNIGRADE</title>
    <script>
      (function() {
        try {
          const theme = localStorage.getItem('theme') || 'system';
          const root = document.documentElement;
          root.classList.remove('light', 'dark');
          let resolved = theme;
          if (theme === 'system') {
            resolved = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          }
          root.classList.add(resolved);
        } catch (e) {}
      })();
    </script>
    <script type="module" crossorigin src="/GPA-and-CGPA-calculator/assets/index-CIPKHLrC.js"></script>
    <link rel="stylesheet" crossorigin href="/GPA-and-CGPA-calculator/assets/index-MqImWIPV.css">
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
